<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Outer Flame Gradient -->
    <linearGradient id="outerFlame" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Radiant Inner Core Gradient -->
    <linearGradient id="innerCore" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="45%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Warm Atmospheric Glow -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#EA580C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Streak Flame -->
  <path d="M32 4C32 4 39.5 16.5 39.5 23.5C39.5 25.2 39 26.8 38.2 28C41.6 25 43.8 21 44.5 17C49.5 23 52 30.5 52 38C52 49 43 58 32 58C21 58 12 49 12 38C12 28.5 17 20.5 24 16C23.5 19.2 24.2 22.5 25.8 25C26.8 19.5 28.8 11.5 32 4Z" 
        fill="url(#outerFlame)" 
        filter="url(#flameGlow)"/>

  <!-- Inner Energy Core -->
  <path d="M32 29C32 29 35.5 34.5 35.5 38C35.5 39 35.2 39.8 34.8 40.5C36.2 39 37.2 37 37.5 35C39.5 38.2 40.5 41.2 40.5 44C40.5 48.7 36.7 52.5 32 52.5C27.3 52.5 23.5 48.7 23.5 44C23.5 39.5 26 36 28.5 34C28.2 35.5 28.5 37 29.5 38.2C30 35.5 31 32 32 29Z" 
        fill="url(#innerCore)"/>
</svg>
