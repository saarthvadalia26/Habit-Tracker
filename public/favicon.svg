<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Indigo to Purple) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base for 100% visibility on both Light & Dark tabs -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ambient Glow -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#centerGlow)"/>

  <!-- Orbit Icon from Lucide (scaled and centered) -->
  <g transform="translate(128, 128) scale(10.6666)" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20.341 6.484A10 10 0 0 1 10.266 21.85"></path>
    <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152"></path>
    <circle cx="12" cy="12" r="3"></circle>
    <circle cx="19" cy="5" r="2"></circle>
    <circle cx="5" cy="19" r="2"></circle>
  </g>
</svg>