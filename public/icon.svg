<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Warm Obsidian to Deep Charcoal) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a16"/>
      <stop offset="100%" stop-color="#12100d"/>
    </linearGradient>

    <!-- Subtle Border Accent -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Vibrant Signature Flame Gradient -->
    <linearGradient id="outerFlame" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#e04a12"/>
      <stop offset="45%" stop-color="#ff5a1f"/>
      <stop offset="85%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Radiant Inner Core Gradient -->
    <linearGradient id="innerCore" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#12100d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base for 100% visibility on both Light & Dark tabs -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ambient Glow -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#centerGlow)"/>

  <!-- Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="url(#borderGrad)" stroke-width="16" stroke-opacity="0.8"/>

  <!-- Outer Streak Flame -->
  <path d="M256 80 C256 80 318 175 318 230 C318 244 314 257 308 266 C334 242 350 209 356 178 C395 225 414 284 414 342 C414 428 344 448 256 448 C168 448 98 428 98 342 C98 268 136 205 191 170 C187 195 192 221 204 240 C212 198 228 138 256 80 Z" 
        fill="url(#outerFlame)"/>

  <!-- Inner Energy Core -->
  <path d="M256 270 C256 270 284 312 284 338 C284 345 281 352 278 358 C289 346 296 331 298 316 C314 340 322 364 322 385 C322 421 292 432 256 432 C220 432 190 421 190 385 C190 351 209 324 229 308 C226 320 229 330 236 339 C241 318 248 292 256 270 Z" 
        fill="url(#innerCore)"/>

  <!-- Discipline Spark at Top -->
  <circle cx="256" cy="74" r="10" fill="#fbbf24"/>
</svg>